# Builds the Docker image, publishes it to GitHub Packages (ghcr.io) and creates a GitHub release.
# Run it from Actions → Release → Run workflow (enter a version like 1.0.0), or push a tag:  git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [{"name": "triageiq", "context": ".", "file": "Dockerfile"}]
    steps:
      - uses: actions/checkout@v4
      - name: Version without the leading v
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image labels (including org.opencontainers.image.source) link the package to this repo,
      # so it shows under "Packages" on the repo page.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hemashreevi/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION#v}"
          cat > notes.md <<'EOF'
          ## Try the console in one command

          ```bash
          docker run -p 8050:8050 ghcr.io/hemashreevi/triageiq:${VERSION}
          ```

          Then open http://localhost:8050. The image runs the console in **demo mode**: tickets and AI results are simulated, nothing is emailed, and it needs no secrets. The real system (Kafka, Qdrant, Ollama and a Gmail inbox) runs on your own machine; see the README.
          EOF
          sed -i "s/\${VERSION}/$VERSION/g" notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "TriageIQ v$VERSION" --notes-file notes.md
