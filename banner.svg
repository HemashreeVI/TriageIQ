<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151B3B"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- floating dots (tickets drifting in) -->
  <g fill="#6366F1" fill-opacity="0.35">
    <circle cx="760" cy="60" r="5"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="230" r="7"><animate attributeName="cy" values="230;250;230" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="90" r="4"><animate attributeName="cy" values="90;70;90" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="200" r="6"><animate attributeName="cy" values="200;220;200" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- icon -->
  <g transform="translate(70 48) scale(0.8)">
    <rect width="256" height="256" rx="56" fill="url(#g)"/>
    <path d="M52 84 H204 a8 8 0 0 1 8 8 V114 a14 14 0 0 0 0 28 V164 a8 8 0 0 1 -8 8 H52 a8 8 0 0 1 -8 -8 V142 a14 14 0 0 0 0 -28 V92 a8 8 0 0 1 8 -8 Z" fill="#FFFFFF" fill-opacity="0.96"/>
    <polyline points="68,128 98,128 112,100 128,152 142,116 152,128 188,128" fill="none" stroke="#6366F1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="210" stroke-dashoffset="210">
      <animate attributeName="stroke-dashoffset" values="210;0;0;-210" keyTimes="0;0.45;0.75;1" dur="3s" repeatCount="indefinite"/>
    </polyline>
    <circle cx="208" cy="64" r="12" fill="#F43F5E">
      <animate attributeName="r" values="10;14;10" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="310" y="145" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="84" font-weight="800" fill="url(#t)">TriageIQ</text>
  <text x="312" y="195" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="28" fill="#CBD5E1">Real-time LLM-powered support ticket triage</text>
  <text x="312" y="238" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" fill="#94A3B8">Kafka  ·  RAG  ·  FastAPI  ·  Docker  ·  Langfuse</text>

  <line x1="312" y1="262" x2="1130" y2="262" stroke="#6366F1" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 12">
    <animate attributeName="stroke-dashoffset" values="0;-26" dur="1s" repeatCount="indefinite"/>
  </line>
</svg>
