<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="feat-t feat-d">
<title id="feat-t">TriageIQ features</title>
<desc id="feat-d">Live console: Overview, approval queue, urgent, analytics. Light and dark, works on a phone.; Phone access: Cloudflare tunnel behind a login, ntfy push for every new ticket.; Safe fallback: If the model fails, the ticket goes to a human instead of getting lost.; Loop protection: Auto-replies, bounces, lists and no-reply senders are ignored.; No duplicates: De-duplicated by Message-ID, marked read only after Kafka confirms.; Rate limits: Per sender, so one address cannot flood the queue.; Secure login: Signed HttpOnly cookie, lockout, same-origin checks, strict headers.; Same thread: The approved reply goes back in the customer's email thread.; Analytics: Volume, topics, AI response time, accuracy and a confusion matrix.</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="feat-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#13213F"/><stop offset=".55" stop-color="#0A1222"/><stop offset="1" stop-color="#050912"/></radialGradient>
<radialGradient id="feat-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2A4C9A" stop-opacity=".5"/><stop offset="1" stop-color="#2A4C9A" stop-opacity="0"/></radialGradient>
<radialGradient id="feat-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F4A73B" stop-opacity=".14"/><stop offset="1" stop-color="#F4A73B" stop-opacity="0"/></radialGradient>
<linearGradient id="feat-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#FFD592"/><stop offset="1" stop-color="#F4A73B"/></linearGradient>
<linearGradient id="feat-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4A73B" stop-opacity="0"/><stop offset=".25" stop-color="#F4A73B" stop-opacity=".85"/><stop offset="1" stop-color="#F4A73B" stop-opacity="0"/></linearGradient>
<pattern id="feat-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#F4A73B" stroke-opacity=".05"/></pattern>
</defs>
