<linearGradient id="hero-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#FFD592"/><stop offset="1" stop-color="#F4A73B"/></linearGradient>
<linearGradient id="hero-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4A73B" stop-opacity="0"/><stop offset=".25" stop-color="#F4A73B" stop-opacity=".85"/><stop offset="1" stop-color="#F4A73B" stop-opacity="0"/></linearGradient>
