<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 448" width="1200" height="448" role="img" aria-labelledby="stk-t stk-d">
<title id="stk-t">TriageIQ tech stack</title>
<desc id="stk-d">Streaming: Apache Kafka, Docker Compose; Ai: Ollama, qwen2.5:3b, nomic-embed-text; Search: Qdrant, RAG over past tickets; Backend: FastAPI + SSE, SQLite, Gmail IMAP / SMTP; Phone: Cloudflare Tunnel, ntfy push; Front End: HTML · CSS · JS, Chart.js</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="stk-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#13213F"/><stop offset=".55" stop-color="#0A1222"/><stop offset="1" stop-color="#050912"/></radialGradient>
<radialGradient id="stk-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2A4C9A" stop-opacity=".5"/><stop offset="1" stop-color="#2A4C9A" stop-opacity="0"/></radialGradient>
<radialGradient id="stk-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F4A73B" stop-opacity=".14"/><stop offset="1" stop-color="#F4A73B" stop-opacity="0"/></radialGradient>
<linearGradient id="stk-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#FFD592"/><stop offset="1" stop-color="#F4A73B"/></linearGradient>
<linearGradient id="stk-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4A73B" stop-opacity="0"/><stop offset=".25" stop-color="#F4A73B" stop-opacity=".85"/><stop offset="1" stop-color="#F4A73B" stop-opacity="0"/></linearGradient>
<pattern id="stk-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#F4A73B" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="446" rx="22" fill="url(#stk-bg)" stroke="#1C2A4A"/>
<rect x="1" y="1" width="1198" height="446" rx="22" fill="url(#stk-grid)"/>
<ellipse cx="600" cy="224" rx="420" ry="314" fill="url(#stk-glowA)"/>
<ellipse cx="600" cy="224" rx="300" ry="224" fill="url(#stk-glowB)"/><rect x="40" y="40" width="363" height="176" rx="16" fill="#0F1A31" stroke="#2B3F6B"/><text x="60" y="72" class="mono" font-size="11" fill="#F4A73B" text-anchor="start" letter-spacing="2.5">STREAMING</text><text x="60" y="110" class="serif" font-size="22" fill="#F2F1EC" text-anchor="start" >Apache Kafka</text><text x="60" y="146" class="serif" font-size="17" fill="#CCD2E0" text-anchor="start" >Docker Compose</text><rect x="419" y="40" width="363" height="176" rx="16" fill="#0F1A31" stroke="#2B3F6B"/><text x="439" y="72" class="mono" font-size="11" fill="#F4A73B" text-anchor="start" letter-spacing="2.5">AI</text><text x="439" y="110" class="serif" font-size="22" fill="#F2F1EC" text-anchor="start" >Ollama</text><text x="439" y="146" class="serif" font-size="17" fill="#CCD2E0" text-anchor="start" >qwen2.5:3b</text><text x="439" y="177" class="serif" font-size="15" fill="#93A0BB" text-anchor="start" >nomic-embed-text</text><rect x="797" y="40" width="363" height="176" rx="16" fill="#0F1A31" stroke="#2B3F6B"/><text x="817" y="72" class="mono" font-size="11" fill="#F4A73B" text-anchor="start" letter-spacing="2.5">SEARCH</text><text x="817" y="110" class="serif" font-size="22" fill="#F2F1EC" text-anchor="start" >Qdrant</text><text x="817" y="146" class="serif" font-size="17" fill="#CCD2E0" text-anchor="start" >RAG over past tickets</text><rect x="40" y="232" width="363" height="176" rx="16" fill="#0F1A31" stroke="#2B3F6B"/><text x="60" y="264" class="mono" font-size="11" fill="#F4A73B" text-anchor="start" letter-spacing="2.5">BACKEND</text><text x="60" y="302" class="serif" font-size="22" fill="#F2F1EC" text-anchor="start" >FastAPI + SSE</text><text x="60" y="338" class="serif" font-size="17" fill="#CCD2E0" text-anchor="start" >SQLite</text><text x="60" y="369" class="serif" font-size="15" fill="#93A0BB" text-anchor="start" >Gmail IMAP / SMTP</text><rect x="419" y="232" width="363" height="176" rx="16" fill="#0F1A31" stroke="#2B3F6B"/><text x="439" y="264" class="mono" font-size="11" fill="#F4A73B" text-anchor="start" letter-spacing="2.5">PHONE</text><text x="439" y="302" class="serif" font-size="22" fill="#F2F1EC" text-anchor="start" >Cloudflare Tunnel</text><text x="439" y="338" class="serif" font-size="17" fill="#CCD2E0" text-anchor="start" >ntfy push</text><rect x="797" y="232" width="363" height="176" rx="16" fill="#0F1A31" stroke="#2B3F6B"/><text x="817" y="264" class="mono" font-size="11" fill="#F4A73B" text-anchor="start" letter-spacing="2.5">FRONT END</text><text x="817" y="302" class="serif" font-size="22" fill="#F2F1EC" text-anchor="start" >HTML · CSS · JS</text><text x="817" y="338" class="serif" font-size="17" fill="#CCD2E0" text-anchor="start" >Chart.js</text>
</svg>
